[project]
name = "analyzer-tsumtsum"
version = "0.1.0"
description = "TsumTsum analyzer desktop app with PySide6."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PySide6",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "Pillow>=10.0.0",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.4.9",
  "torch>=2.0.0",
  "torchvision>=0.15.0",
]

[project.optional-dependencies]
gpu = [
  # RTX 等: pip install -e ".[gpu]" ではなく下記 index で直接入れる（CPU 版と混在しないよう）
  # pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
  "torch>=2.6.0",
  "torchvision>=0.21.0",
]

[project.scripts]
analyzer-tsumtsum = "app.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
